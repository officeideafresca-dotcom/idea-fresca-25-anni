<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Idea Fresca 25 Anni — Schermo</title>
<link rel="stylesheet" href="/css/screen.css" />
</head>
<body>
<div class="screen" id="screenRoot">

  <div class="topbar">
    <div class="brand">IF <span>25</span> ANNI — BEYOND</div>
    <div class="phase-pill" id="phasePill">—</div>
    <div class="timer" id="timerText">30:00</div>
  </div>

  <div class="totals-band">
    <div class="stat"><div class="value" id="totalNetwork">0</div><div class="label" id="lblNetwork">Nuovi Partner</div></div>
    <div class="stat"><div class="value" id="totalRetention">0%</div><div class="label" id="lblRetention">Fidelizzazione</div></div>
    <div class="stat"><div class="value" id="totalSymbolic">0</div><div class="label" id="lblSymbolic">Azioni 25°</div></div>
    <div class="stat"><div class="value" id="totalTables">0/10</div><div class="label" id="lblTables">Tavoli inviati</div></div>
  </div>

  <div class="reveal-banner" id="revealBanner" style="display:none;"></div>

  <div class="main-area">
    <div class="side-col" id="colLeft"></div>
    <div class="mosaic-wrap">
      <div class="mosaic-title" id="mosaicTitle">IF<br/>25</div>
      <div class="mosaic-grid" id="mosaicGrid"></div>
    </div>
    <div class="side-col" id="colRight"></div>
  </div>

  <div class="photo-pop" id="photoPop">
    <div id="photoPopMedia"></div>
    <div class="leader-name" id="photoPopName"></div>
    <div class="table-tag" id="photoPopTable"></div>
  </div>

  <div class="flash-overlay" id="flashOverlay"></div>

  <div class="launch-overlay" id="launchOverlay">
    <div class="big-title">IF <span>25</span> ANNI — BEYOND</div>
    <img class="qr" id="qrImg" src="/api/qr" alt="QR" />
    <div class="cta" id="launchCta">Scansiona per partecipare</div>
    <div class="sub" id="launchSub"></div>
    <div class="big-timer" id="launchTimer">30:00</div>
  </div>

</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/screen.js"></script>
</body>
</html>
