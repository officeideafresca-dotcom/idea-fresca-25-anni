<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>Idea Fresca — 25 Anni</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>
<div class="app">
  <div class="app-header">
    <div class="lang-switch" id="langSwitch"></div>
    <div class="brand" id="brandText">Idea Fresca — 25 Anni</div>
    <div class="slogan" id="sloganText">La nostra visione, costruita da tutti noi</div>
    <div class="status-badge" id="statusBadge">—</div>
  </div>

  <div class="app-body" id="appBody">
    <div class="card" id="photoCard">
      <h2 id="photoTitle">L'Immagine: il Fattore Umano</h2>
      <p class="subtitle" id="photoSubtitle">Scatta un selfie di squadra pieno di energia</p>

      <input type="file" accept="image/*" capture="user" id="photoInput" style="display:none;" />
      <button class="btn gold" id="takePhotoBtn">Scatta / carica selfie</button>
      <img id="photoPreview" class="photo-preview" alt="" />

      <label id="powerMessageLabel">Power Message</label>
      <p class="help-text" id="powerMessageHelp"></p>
      <input type="text" id="powerMessageInput" maxlength="60" placeholder="" />

      <button class="btn" id="sendPhotoBtn" style="display:none;">Invia foto</button>
      <div class="photo-count" id="photoCountText"></div>
    </div>
  </div>

  <div class="footer-note">Idea Fresca · Digital Vision Mosaic &amp; Numbers Quest</div>
</div>

<div class="toast" id="toast"></div>

<div class="final-image-overlay" id="finalImageOverlay">
  <div class="final-image-box">
    <h2 id="finalImageTitle">La nostra visione è pronta!</h2>
    <img id="finalImageImg" alt="" />
    <p class="hint" id="finalImageHint">Tieni premuto sull'immagine per salvarla.</p>
    <a class="btn gold" id="finalImageSaveBtn" download="idea-fresca-25-anni-vision.jpg">Salva sul telefono</a>
    <button class="btn secondary" id="finalImageCloseBtn">Chiudi</button>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="/js/i18n.js"></script>
<script src="/js/participant.js"></script>
</body>
</html>
